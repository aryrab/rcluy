<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Geist:wght@400;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* ==========================================================
     RCL Cueros — sistema visual
     Lienzo claro, paneles casi negros, tipografía editorial,
     líneas finas en lugar de sombras, un solo acento rojo.
     ========================================================== */
  :root{
    /* Color */
    --color-carbon-ink:#1a211e;
    --color-paper-white:#ffffff;
    --color-true-black:#000000;
    --color-obsidian:#0c0c0c;
    --color-fog:#eef1f0;
    --color-mist:#e0e0e0;
    --color-graphite:#606562;
    --color-ash-border:#cccfcd;
    --color-slate:#363537;
    --color-pewter:#4e4e4e;
    --color-ember-red:#cc2e39;
    --color-control:#868b88;           /* borde de campos: 3:1 sobre blanco */

    --ink:var(--color-carbon-ink);
    --paper:var(--color-paper-white);
    --obsidian:var(--color-obsidian);
    --fog:var(--color-fog);
    --mist:var(--color-mist);
    --graphite:var(--color-graphite);
    --ash:var(--color-ash-border);
    --slate:var(--color-slate);
    --pewter:var(--color-pewter);
    --ember:var(--color-ember-red);
    --control:var(--color-control);

    /* Alias que todavía usa el JS en estilos en línea */
    --linea:var(--color-ash-border);
    --verde-osc:var(--color-pewter);

    /* Tipografía */
    --font-body:"Geist","Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --font-display:"Instrument Serif","Times New Roman",Georgia,serif;
    --font-label:"Barlow Condensed","Arial Narrow","Inter Display","Inter",ui-sans-serif,sans-serif;

    /* Forma y ritmo */
    --r-sm:4px;
    --r-md:8px;
    --r-pill:9999px;
    --max:1440px;
    --gutter:clamp(20px,4vw,40px);
    --seccion:clamp(56px,7vw,80px);
    --h-header:72px;

    /* Movimiento */
    --ease-out:cubic-bezier(0.23,1,0.32,1);
    --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  }

  *,*::before,*::after{box-sizing:border-box;}
  html{
    -webkit-text-size-adjust:100%;
    scroll-behavior:smooth;
    scrollbar-color:var(--ash) transparent;
    scrollbar-width:thin;
  }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
    caret-color:var(--ink);
  }
  h1,h2,h3,h4,p{margin:0;}
  a{color:inherit;}
  img{display:block;max-width:100%;}
  button{font:inherit;color:inherit;cursor:pointer;}
  ::selection{background:var(--ink);color:var(--paper);}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
  .sobre-oscuro :focus-visible{outline-color:var(--paper);}
  input,select,textarea{font:inherit;}
  ::placeholder{color:var(--graphite);opacity:1;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--ash);border-radius:var(--r-pill);border:2px solid var(--paper);}
  ::-webkit-scrollbar-track{background:transparent;}

  .sr-only{
    position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }
  .in{max-width:var(--max);margin:0 auto;padding-inline:var(--gutter);}
  .ico{
    width:20px;height:20px;flex:none;fill:none;stroke:currentColor;
    stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
  }

  /* Voz de etiqueta: condensada, mayúsculas, con tracking positivo */
  .etiqueta,
  .btn,
  .chip,
  nav.tabs > button,
  .dropdown > .dropbtn{
    font-family:var(--font-label);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.057em;
  }

  /* Voz display: serif de un solo peso, itálica, tracking cerrado */
  .display{
    font-family:var(--font-display);
    font-weight:400;
    font-style:italic;
    line-height:1.08;
    letter-spacing:-0.025em;
    text-wrap:balance;
  }

  /* ---------- Botones ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    min-height:44px;padding:12px 20px;
    border:1px solid transparent;border-radius:var(--r-sm);
    font-size:16px;line-height:1.1;text-decoration:none;white-space:nowrap;
    background:none;
    transition:opacity 160ms var(--ease-out),transform 160ms var(--ease-out),background-color 160ms var(--ease-out),color 160ms var(--ease-out);
  }
  .btn:active{transform:scale(0.97);}
  .btn-solido{background:var(--ink);color:var(--paper);}
  .btn-claro{background:var(--paper);color:var(--ink);}
  .btn-contorno{border-color:var(--paper);color:var(--paper);}
  .btn-ghost{min-height:44px;padding:12px 4px;color:var(--ink);}
  .btn-ghost .ico{transition:transform 200ms var(--ease-out);}
  @media (hover:hover) and (pointer:fine){
    .btn:hover{opacity:0.85;}
    .btn-ghost:hover .ico{transform:translateX(3px);}
  }

  /* ---------- Barra de anuncio ---------- */
  .anuncio{background:var(--ink);color:var(--paper);}
  .anuncio .in{
    min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:24px;
    font-family:var(--font-label);font-weight:700;font-size:14px;
    text-transform:uppercase;letter-spacing:0.057em;
  }
  .anuncio-enlaces{display:flex;gap:24px;}
  .anuncio-enlaces button{
    background:none;border:0;padding:8px 0;color:var(--paper);
    font:inherit;letter-spacing:inherit;text-transform:inherit;
    transition:opacity 160ms var(--ease-out);
  }
  @media (hover:hover) and (pointer:fine){.anuncio-enlaces button:hover{opacity:0.7;}}

  /* ---------- Cabecera ---------- */
  header.top{
    position:sticky;top:0;z-index:30;
    background:var(--paper);
    border-bottom:1px solid var(--mist);
  }
  .header-in{
    max-width:var(--max);margin:0 auto;padding-inline:var(--gutter);
    min-height:var(--h-header);
    display:grid;
    grid-template-columns:auto 1fr minmax(200px,320px) auto;
    grid-template-areas:"logo nav search cart";
    align-items:center;column-gap:32px;
  }
  .header-centro{grid-area:logo;justify-self:start;}
  nav.tabs{
    grid-area:nav;align-self:stretch;
    display:flex;align-items:stretch;gap:28px;
  }
  .header-izq{grid-area:search;}
  .header-der{grid-area:cart;justify-self:end;display:flex;align-items:center;}
  .btn-menu-hamburguesa{grid-area:menu;display:none;}

  .logo-img{max-height:44px;width:auto;object-fit:contain;}
  .logo-img.logo-claro{filter:brightness(0);}
  .header-centro a{display:flex;align-items:center;text-decoration:none;min-height:44px;}
  .marca-texto{
    font-family:var(--font-label);font-weight:700;font-size:26px;line-height:1;
    letter-spacing:0.057em;text-transform:uppercase;color:var(--ink);
  }

  nav.tabs > button,
  .dropdown > .dropbtn{
    background:none;border:0;padding:0 2px;
    font-size:16px;color:var(--slate);
    display:inline-flex;align-items:center;position:relative;
    transition:color 160ms var(--ease-out);
  }
  nav.tabs > button::after,
  .dropdown > .dropbtn:first-child::after{
    content:"";position:absolute;left:2px;right:2px;bottom:-1px;height:2px;background:var(--ink);
    transform:scaleX(0);transform-origin:left;
    transition:transform 220ms var(--ease-out);
  }
  nav.tabs > button.activa,
  .dropdown.activa > .dropbtn{color:var(--ink);}
  nav.tabs > button.activa::after,
  .dropdown.activa > .dropbtn:first-child::after{transform:scaleX(1);}
  @media (hover:hover) and (pointer:fine){
    nav.tabs > button:hover,.dropdown > .dropbtn:hover{color:var(--ink);}
  }

  .dropdown{position:relative;display:inline-flex;align-items:stretch;}
  .dropdown > .dropbtn + .dropbtn{padding-left:0;margin-left:2px;}
  .dropdown > .dropbtn .ico{width:16px;height:16px;}
  .dropdown-content{
    display:none;position:absolute;top:100%;left:-12px;min-width:200px;
    background:var(--paper);border:1px solid var(--mist);border-radius:var(--r-md);
    padding:6px;z-index:100;transform-origin:top left;
  }
  .dropdown.abierto .dropdown-content{display:block;animation:desplegar 160ms var(--ease-out);}
  @media (hover:hover) and (pointer:fine){
    .dropdown:hover .dropdown-content{display:block;animation:desplegar 160ms var(--ease-out);}
  }
  @keyframes desplegar{from{opacity:0;transform:translateY(-4px) scale(0.98);}to{opacity:1;transform:none;}}
  .dropdown-content button{
    display:block;width:100%;text-align:left;
    background:none;border:0;border-radius:var(--r-sm);
    padding:11px 14px;font-size:15px;color:var(--ink);
    transition:background-color 120ms var(--ease-out);
  }
  @media (hover:hover) and (pointer:fine){.dropdown-content button:hover{background:var(--fog);}}

  .header-izq .campo{position:relative;width:100%;}
  .btn-limpiar-busqueda{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:var(--graphite);
    font-size:22px;line-height:1;display:none;align-items:center;justify-content:center;
  }
  .btn-limpiar-busqueda.visible{display:flex;}
  .header-izq .ico{
    position:absolute;left:12px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;color:var(--graphite);pointer-events:none;
  }
  .buscador-input{
    width:100%;height:40px;padding:0 42px 0 38px;
    background:var(--fog);color:var(--ink);
    border:1px solid var(--ash);border-radius:var(--r-sm);
    font-size:14px;
    transition:border-color 160ms var(--ease-out),background-color 160ms var(--ease-out);
  }
  .buscador-input:focus{outline:none;border-color:var(--ink);background:var(--paper);}
  .buscador-input:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}

  .btn-carrito-icono{
    position:relative;width:44px;height:44px;
    display:inline-flex;align-items:center;justify-content:center;
    background:none;border:0;border-radius:var(--r-sm);color:var(--ink);
    transition:transform 160ms var(--ease-out),opacity 160ms var(--ease-out);
  }
  .btn-carrito-icono:active{transform:scale(0.95);}
  .btn-carrito-icono .ico{width:24px;height:24px;}
  .badge{
    position:absolute;top:3px;right:1px;
    min-width:18px;height:18px;padding:0 5px;
    display:flex;align-items:center;justify-content:center;
    background:var(--ember);color:var(--paper);border-radius:var(--r-pill);
    font-family:var(--font-body);font-size:11px;font-weight:700;line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .badge.vacio{display:none;}

  /* Modal de advertencia para personalizados */
.modal-confirm {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.95);
  z-index: 130;
  width: min(440px, 90vw);
  background: var(--paper);
  color: var(--ink);
  padding: 28px 24px;
  border-radius: var(--r-md);
  border: 1px solid var(--mist);
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  opacity: 0;
  pointer-events: none;
  transition: transform 200ms var(--ease-out), opacity 200ms var(--ease-out);
}
.modal-confirm.abierto {
  opacity: 1;
  pointer-events: auto;
  transform: translate(-50%, -50%) scale(1);
}
.modal-confirm h3 {
  font-family: var(--font-label);
  font-size: 20px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 12px;
}
.modal-confirm p {
  font-size: 15px;
  color: var(--slate);
  line-height: 1.5;
  margin-bottom: 24px;
}
.modal-acciones {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
}
.btn-contorno-oscuro {
  border: 1px solid var(--ash);
  color: var(--ink);
  background: transparent;
}
/* ---------- Modales de pedido / estados ---------- */
.modal-sistema-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(12,12,12,0.62);
  opacity:0;pointer-events:none;
  transition:opacity 200ms var(--ease-out);
  backdrop-filter:blur(2px);
}
.modal-sistema-overlay.abierto{opacity:1;pointer-events:auto;}

.modal-sistema{
  position:fixed;top:50%;left:50%;z-index:210;
  width:min(520px,calc(100vw - 32px));
  max-height:min(760px,calc(100vh - 32px));
  overflow:auto;
  transform:translate(-50%,-48%) scale(.97);
  background:var(--paper);color:var(--ink);
  border:1px solid var(--mist);border-radius:var(--r-md);
  box-shadow:0 24px 70px rgba(0,0,0,.28);
  opacity:0;pointer-events:none;
  transition:transform 220ms var(--ease-out),opacity 180ms var(--ease-out);
}
.modal-sistema.abierto{
  opacity:1;pointer-events:auto;
  transform:translate(-50%,-50%) scale(1);
}
.modal-sistema-cab{
  padding:24px 24px 12px;
  border-bottom:1px solid var(--mist);
}
.modal-sistema-cab h3{
  font-family:var(--font-label);font-size:22px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;
}
.modal-sistema-cab p{
  margin-top:6px;color:var(--graphite);font-size:14px;line-height:1.5;
}
.modal-sistema-cuerpo{padding:18px 24px 8px;}
.resumen-pedido-modal{
  display:flex;flex-direction:column;gap:12px;
}
.resumen-pedido-item{
  padding-bottom:12px;border-bottom:1px solid var(--mist);
}
.resumen-pedido-item:last-child{border-bottom:0;}
.resumen-pedido-item .linea-principal{
  display:flex;justify-content:space-between;gap:16px;
  font-weight:600;font-size:15px;
}
.resumen-pedido-item .linea-detalle{
  margin-top:5px;color:var(--graphite);font-size:13px;line-height:1.45;
}
.resumen-pedido-total{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:8px;padding-top:16px;border-top:1px solid var(--ink);
  font-family:var(--font-label);text-transform:uppercase;letter-spacing:.05em;
  font-weight:700;
}
.resumen-pedido-total strong{
  font-family:var(--font-body);font-size:24px;letter-spacing:0;
}
.plazo-pedido{
  margin-top:14px;padding:12px 14px;background:var(--fog);
  border-radius:var(--r-sm);font-size:14px;line-height:1.45;
}
.modal-sistema-acciones{
  display:flex;justify-content:flex-end;gap:10px;
  padding:16px 24px 24px;
}
.modal-sistema-acciones .btn{min-width:130px;}
.estado-vacio{
  grid-column:1/-1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:220px;text-align:center;padding:32px 16px;
}
.estado-vacio h3{
  font-family:var(--font-label);font-size:18px;text-transform:uppercase;
  letter-spacing:.05em;margin-bottom:7px;
}
.estado-vacio p{max-width:44ch;color:var(--graphite);font-size:15px;line-height:1.5;}
.estado-vacio .btn{margin-top:18px;}

@media(max-width:600px){
  .modal-sistema-cab{padding:20px 18px 10px;}
  .modal-sistema-cuerpo{padding:16px 18px 4px;}
  .modal-sistema-acciones{padding:14px 18px 18px;flex-direction:column-reverse;}
  .modal-sistema-acciones .btn{width:100%;}
}


  /* ---------- Menú lateral (celular) ---------- */
  .overlay-menu{
    position:fixed;inset:0;z-index:110;background:rgba(12,12,12,0.5);
    opacity:0;pointer-events:none;transition:opacity 240ms var(--ease-out);
  }
  .overlay-menu.activo{opacity:1;pointer-events:auto;}
  .menu-lateral{
    position:fixed;top:0;left:0;bottom:0;z-index:120;
    width:min(340px,88vw);
    display:flex;flex-direction:column;
    background:var(--paper);color:var(--ink);
    border-right:1px solid var(--mist);
    transform:translateX(-100%);visibility:hidden;
    transition:transform 300ms var(--ease-drawer),visibility 0s linear 300ms;
    overflow-y:auto;
  }
  .menu-lateral.abierto{transform:none;visibility:visible;transition-delay:0s;}
  .menu-lateral-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 8px 0 20px;min-height:64px;border-bottom:1px solid var(--mist);
  }
  .menu-lateral-header h3{
    font-family:var(--font-label);font-weight:700;font-size:16px;
    letter-spacing:0.057em;text-transform:uppercase;
  }
  .btn-cerrar-menu,.cerrar{
    width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;
    background:none;border:0;border-radius:var(--r-sm);color:var(--ink);
    transition:transform 160ms var(--ease-out);
  }
  .btn-cerrar-menu:active,.cerrar:active{transform:scale(0.92);}
  .menu-lateral-contenido{padding:8px 20px 32px;}
  .menu-lateral-contenido button{
    display:block;width:100%;text-align:left;background:none;border:0;
    border-bottom:1px solid var(--mist);padding:16px 0;
    font-family:var(--font-label);font-weight:700;font-size:20px;
    letter-spacing:0.057em;text-transform:uppercase;color:var(--ink);
  }
  .menu-lateral-contenido .subcategoria-btn{
    font-family:var(--font-body);font-weight:400;font-size:16px;
    letter-spacing:0;text-transform:none;color:var(--graphite);
    padding:13px 0 13px 16px;
  }
  .menu-seccion-titulo{
    margin:20px 0 4px;
    font-family:var(--font-label);font-weight:700;font-size:14px;
    letter-spacing:0.038em;text-transform:uppercase;color:var(--graphite);
  }

  /* ---------- Hero partido ---------- */
  .carrusel-hero{
    container-type:inline-size;
    position:relative;overflow:hidden;
    height:clamp(480px,64vh,620px);
    background:var(--obsidian);color:var(--paper);
  }
  .carrusel-slide{
    position:absolute;inset:0;
    display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"texto media";
    visibility:hidden;
    transition:visibility 0s linear 750ms;
  }
  .carrusel-slide.activa{visibility:visible;z-index:2;transition-delay:0s;}
  .carrusel-slide img{
    grid-area:media;width:100%;height:100%;object-fit:cover;
    opacity:0;transform:scale(1.04);
    transition:opacity 0s linear 750ms,transform 0s linear 750ms;
  }
  .carrusel-slide.activa img{
    opacity:1;transform:none;
    transition:opacity 700ms var(--ease-out),transform 2200ms var(--ease-out);
  }
  .carrusel-caption{
    grid-area:texto;
    display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
    padding-block:56px 72px;
    padding-left:max(var(--gutter),calc((100cqw - var(--max)) / 2 + var(--gutter)));
    padding-right:clamp(24px,4vw,72px);
    background:var(--obsidian);
  }
  .carrusel-caption > *{opacity:0;transition:opacity 180ms ease-out;}
  .carrusel-caption > :nth-child(1){--i:0;}
  .carrusel-caption > :nth-child(2){--i:1;}
  .carrusel-caption > :nth-child(3){--i:2;}
  .carrusel-caption > :nth-child(4){--i:3;}
  .carrusel-slide.activa .carrusel-caption > *{
    opacity:1;
    animation:subir 520ms var(--ease-out) both;
    animation-delay:calc(70ms + var(--i,0) * 45ms);
  }
  @keyframes subir{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  .hero-eyebrow{
    font-family:var(--font-label);font-weight:700;font-size:14px;
    letter-spacing:0.057em;text-transform:uppercase;color:var(--paper);
    text-shadow:0 2px 10px rgba(0,0,0,0.72);
  }
  .carrusel-caption h2{
    margin:16px 0 16px;max-width:11ch;
    font-size:clamp(48px,5.6vw,80px);color:var(--paper);
    text-shadow:0 3px 16px rgba(0,0,0,0.78);
  }
  .carrusel-caption p{
    max-width:38ch;margin:0 0 32px;font-size:16px;line-height:1.5;
    color:rgba(255,255,255,0.9);text-wrap:pretty;
    text-shadow:0 2px 10px rgba(0,0,0,0.72);
  }
  /* Separación fija entre los botones del banner y los indicadores */
  .hero-acciones{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:44px;}

  .carrusel-dots{
    position:absolute;z-index:4;bottom:28px;
    left:max(calc(var(--gutter) - 8px),calc((100cqw - var(--max)) / 2 + var(--gutter) - 8px));
    display:flex;
  }
  .dot{
    display:grid;place-items:center;width:20px;height:28px;padding:0;
    background:none;border:0;
    transition:width 300ms var(--ease-out);
  }
  .dot::before{
    content:"";display:block;width:8px;height:8px;border-radius:var(--r-pill);
    background:rgba(255,255,255,0.35);
    transition:width 300ms var(--ease-out),background-color 200ms var(--ease-out);
  }
  .dot.activa{width:36px;}
  .dot.activa::before{width:28px;background:var(--paper);}

  /* ---------- Servicios ---------- */
  .servicios{border-bottom:1px solid var(--mist);}
  .servicios .in{display:grid;grid-template-columns:repeat(3,1fr);}
  .servicio{
    display:flex;align-items:center;gap:16px;padding:24px 24px 24px 0;
  }
  .servicio + .servicio{padding-left:24px;border-left:1px solid var(--mist);}
  .servicio .ico{width:28px;height:28px;stroke-width:1.4;}
  .servicio h4{
    font-family:var(--font-label);font-weight:700;font-size:16px;
    letter-spacing:0.057em;text-transform:uppercase;line-height:1.2;
  }
  .servicio p{font-size:14px;line-height:1.4;color:var(--graphite);margin-top:2px;}

  /* ---------- Secciones de portada ---------- */
  .seccion{padding-block:var(--seccion);}
  .seccion-cab{
    display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
    margin-bottom:clamp(28px,4vw,48px);
  }
  .seccion-cab h2{font-size:clamp(40px,5vw,64px);}
  .controles-carrusel{display:flex;gap:8px;flex:none;}
  .btn-carrusel{
    width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;
    background:none;color:var(--ink);border:1px solid var(--ash);border-radius:var(--r-pill);
    transition:background-color 160ms var(--ease-out),color 160ms var(--ease-out),border-color 160ms var(--ease-out),transform 160ms var(--ease-out);
  }
  .btn-carrusel:active{transform:scale(0.95);}
  @media (hover:hover) and (pointer:fine){
    .btn-carrusel:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  }

  .manifiesto{background:var(--ink);color:var(--paper);}
  .manifiesto .in{
    padding-block:clamp(64px,9vw,112px);
    display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(32px,6vw,96px);align-items:end;
  }
  .manifiesto h2{font-size:clamp(48px,6.4vw,96px);}
  .manifiesto-texto p{
    max-width:44ch;margin-bottom:28px;font-size:16px;color:rgba(255,255,255,0.8);text-wrap:pretty;
  }

  .galeria-contenedor-wrapper{position:relative;}
  .galeria-inicio{
    display:flex;flex-wrap:nowrap;gap:16px;
    overflow-x:auto;scroll-behavior:smooth;scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
    margin-inline:calc(var(--gutter) * -1);padding-inline:var(--gutter);
    scroll-padding-inline:var(--gutter);
  }
  .galeria-inicio::-webkit-scrollbar{display:none;}
  .galeria-inicio .foto-cliente{
    flex:0 0 clamp(200px,24vw,320px);aspect-ratio:1/1;
    border-radius:var(--r-md);overflow:hidden;background:var(--fog);scroll-snap-align:start;
  }
  .galeria-inicio .foto-cliente img{width:100%;height:100%;object-fit:cover;}

  /* ---------- Grilla y tarjetas ---------- */
  .grilla{
    display:grid;gap:40px 24px;
    grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));
  }
  .tarjeta{
    position:relative;display:flex;flex-direction:column;cursor:pointer;
    background:none;border:0;border-radius:0;
  }
  .foto{
    position:relative;width:100%;aspect-ratio:1/1;
    background:var(--fog);border-radius:var(--r-md);overflow:hidden;
  }
  .foto img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    transition:transform 360ms var(--ease-out),opacity 200ms var(--ease-out);
  }
  .foto svg{
    position:absolute;top:50%;left:50%;width:36%;height:36%;
    transform:translate(-50%,-50%);stroke:var(--graphite);stroke-width:1;
  }
  @media (hover:hover) and (pointer:fine){
    .tarjeta:hover .foto img{transform:scale(1.03);}
  }
  .info{display:flex;flex-direction:column;gap:4px;flex:1;padding-top:14px;}
  .nombre-prod{font-size:16px;font-weight:600;line-height:1.3;color:var(--ink);}
  .desc-prod{
    flex:1;font-size:14px;line-height:1.45;color:var(--graphite);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .fila-precio{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;}
  .precio{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);}
  .btn-ver{
    min-height:36px;padding:7px 14px;
    background:none;color:var(--ink);
    border:1px solid var(--ink);border-radius:var(--r-sm);
    font-family:var(--font-label);font-weight:700;font-size:14px;
    letter-spacing:0.038em;text-transform:uppercase;
    transition:background-color 160ms var(--ease-out),color 160ms var(--ease-out),transform 160ms var(--ease-out);
  }
  .btn-ver:active{transform:scale(0.97);}
  @media (hover:hover) and (pointer:fine){
    .tarjeta:hover .btn-ver:not(:disabled){background:var(--ink);color:var(--paper);}
  }
  .btn-ver.sin-stock,.btn-ver:disabled{color:var(--graphite);border-color:var(--ash);cursor:default;}

  .cartel-sin-stock{
    position:absolute;top:8px;left:8px;z-index:2;
    padding:3px 10px;border-radius:var(--r-pill);
    background:var(--pewter);color:var(--paper);
    font-family:var(--font-label);font-weight:700;font-size:14px;
    letter-spacing:0.038em;text-transform:uppercase;line-height:1.2;
  }
  .tarjeta:has(.cartel-sin-stock) .foto img{opacity:0.55;filter:grayscale(1);}
  .tarjeta:has(.cartel-sin-stock) .nombre-prod,
  .tarjeta:has(.cartel-sin-stock) .precio{color:var(--graphite);}

  .tarjeta-esqueleto{cursor:default;}
  .tarjeta-esqueleto .foto,
  .tarjeta-esqueleto .linea-esqueleto{
    background:linear-gradient(90deg,var(--fog) 25%,#e3e7e5 37%,var(--fog) 63%);
    background-size:400% 100%;
    animation:brillo-esqueleto 1.4s ease infinite;
  }
  .tarjeta-esqueleto .linea-esqueleto{height:12px;margin:6px 0;border-radius:var(--r-sm);}
  @keyframes brillo-esqueleto{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

  /* ---------- Vistas internas ---------- */
  .contenedor-principal{
    max-width:var(--max);margin:0 auto;
    padding:clamp(40px,6vw,72px) var(--gutter) clamp(72px,9vw,120px);
    min-height:60vh;
  }
  .categoria-titulo{font-size:clamp(44px,6vw,80px);margin-bottom:12px;}
  .categoria-desc{
    max-width:56ch;font-size:16px;color:var(--graphite);text-wrap:pretty;
  }
  .filtros{
    display:flex;gap:8px;margin:32px 0 40px;padding-bottom:2px;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .filtros::-webkit-scrollbar{display:none;}
  .chip{
    flex:none;height:40px;padding:0 20px;
    display:inline-flex;align-items:center;
    background:none;color:var(--slate);
    border:1px solid var(--ash);border-radius:var(--r-pill);
    font-size:16px;line-height:1;
    transition:background-color 160ms var(--ease-out),color 160ms var(--ease-out),border-color 160ms var(--ease-out),transform 160ms var(--ease-out);
  }
  .chip:active{transform:scale(0.97);}
  .chip.activa{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  @media (hover:hover) and (pointer:fine){
    .chip:not(.activa):hover{border-color:var(--ink);color:var(--ink);}
  }

  /* Detalle de producto */
  #vista-detalle{display:none;}
  .btn-volver{
    display:inline-flex;align-items:center;gap:8px;min-height:44px;margin:0 0 24px -4px;padding:0 4px;
    background:none;border:0;color:var(--ink);
    font-family:var(--font-label);font-weight:700;font-size:16px;
    letter-spacing:0.057em;text-transform:uppercase;
  }
  .btn-volver .ico{transition:transform 200ms var(--ease-out);}
  @media (hover:hover) and (pointer:fine){.btn-volver:hover .ico{transform:translateX(-3px);}}

  .detalle-caja{
    display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);
    gap:clamp(32px,5vw,72px);align-items:start;
  }
  .detalle-galeria{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .detalle-foto{
    position:relative;width:100%;aspect-ratio:1/1;
    background:var(--fog);border-radius:var(--r-md);overflow:hidden;
  }
  .detalle-foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .detalle-foto svg{
    position:absolute;top:50%;left:50%;width:30%;height:30%;
    transform:translate(-50%,-50%);stroke:var(--graphite);stroke-width:1;
  }
  .detalle-miniaturas{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;}
  .detalle-miniaturas::-webkit-scrollbar{display:none;}
  .miniatura{
    flex:none;width:72px;height:72px;object-fit:cover;
    border:1px solid var(--mist);border-radius:var(--r-sm);cursor:pointer;opacity:0.65;
    transition:opacity 160ms var(--ease-out),border-color 160ms var(--ease-out);
  }
  .miniatura:hover{opacity:1;}
  .miniatura.activa{opacity:1;border-color:var(--ink);outline:1px solid var(--ink);outline-offset:-2px;}

  .detalle-info{display:flex;flex-direction:column;min-width:0;}
  .detalle-nombre{
    font-family:var(--font-display);font-weight:400;font-style:italic;
    font-size:clamp(40px,4.4vw,60px);line-height:1.06;letter-spacing:-0.025em;
    text-wrap:balance;margin-bottom:16px;
  }
  .detalle-precio-base{
    font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;margin-bottom:20px;
  }
  .precio-anterior{
    text-decoration:line-through;opacity:.55;font-size:.72em;font-weight:400;margin-right:5px;
  }
  .badge-descuento{
    display:inline-flex;align-items:center;justify-content:center;
    padding:4px 7px;border-radius:999px;background:#e7f3eb;color:#1d6b3d;
    font-size:12px;font-weight:700;line-height:1;margin-left:6px;vertical-align:middle;
  }

  /* ---------- Favoritos ---------- */
  .btn-favorito{
    position:absolute;top:12px;right:12px;z-index:3;
    width:38px;height:38px;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.94);color:var(--ink);
    border:1px solid rgba(26,33,30,.12);border-radius:50%;
    box-shadow:0 4px 14px rgba(0,0,0,.08);
    transition:transform 160ms var(--ease-out),background-color 160ms var(--ease-out),color 160ms var(--ease-out);
  }
  .btn-favorito svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;}
  .btn-favorito.activo{background:var(--ink);color:var(--paper);}
  .btn-favorito.activo svg{fill:currentColor;}
  @media (hover:hover) and (pointer:fine){.btn-favorito:hover{transform:scale(1.06);}}
  .header-favorito{margin-right:2px;}
  .detalle-favorito{position:relative;top:auto;right:auto;flex:none;box-shadow:none;}

  /* ---------- Acciones de compra ---------- */
  .detalle-acciones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px;}
  .btn-comprar-ahora{
    width:100%;min-height:56px;padding:16px;background:var(--paper);color:var(--ink);
    border:1px solid var(--ink);border-radius:var(--r-sm);
    font-family:var(--font-label);font-weight:700;font-size:17px;letter-spacing:.057em;text-transform:uppercase;
    transition:background-color 160ms var(--ease-out),color 160ms var(--ease-out),transform 160ms var(--ease-out);
  }
  .btn-comprar-ahora:active{transform:scale(.98);}
  @media (hover:hover) and (pointer:fine){.btn-comprar-ahora:hover{background:var(--fog);}}

  /* ---------- Carrito mejorado ---------- */
  .carrito-acciones-secundarias{display:flex;justify-content:space-between;gap:16px;margin-top:12px;}
  .carrito-link{background:none;border:0;padding:4px 0;color:var(--graphite);font-size:13px;text-decoration:underline;text-underline-offset:3px;}
  .carrito-link:hover{color:var(--ink);}
  .item-precio-unit .precio-anterior{font-size:.82em;}

  /* ---------- Instagram ---------- */
  .instagram-cta{
    display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:28px;
    margin-top:34px;padding:28px 0;border-top:1px solid var(--mist);
  }
  .instagram-cta h3{font-family:var(--font-label);font-size:18px;text-transform:uppercase;letter-spacing:.057em;margin-bottom:4px;}
  .instagram-cta p{color:var(--graphite);font-size:14px;}

  /* ---------- Navegación inferior móvil ---------- */
  .mobile-nav{display:none;}
  @media (max-width:768px){
  /* Carrusel móvil: sin animaciones/visibilidad heredadas para asegurar que el texto siempre se renderice. */
  .carrusel-hero{
    height:auto;
    min-height:0;
    overflow:hidden;
    background:var(--obsidian);
  }

  .carrusel-slide,
  .carrusel-slide.activa{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    visibility:hidden;
    opacity:0;
    z-index:0;
    transition:none !important;
  }

  .carrusel-slide.activa{
    position:relative;
    visibility:visible !important;
    opacity:1 !important;
    z-index:2;
  }

  .carrusel-slide img,
  .carrusel-slide.activa img{
    display:block;
    order:1;
    flex:0 0 46vw;
    width:100%;
    height:46vw;
    max-height:330px;
    min-height:220px;
    object-fit:cover;
    object-position:center center;
    opacity:1 !important;
    transform:none !important;
    transition:none !important;
  }

  .carrusel-caption,
  .carrusel-slide.activa .carrusel-caption{
    display:flex;
    order:2;
    position:relative;
    z-index:5;
    flex:1 1 auto;
    min-height:310px;
    width:100%;
    box-sizing:border-box;
    justify-content:center;
    align-items:flex-start;
    padding:24px var(--gutter) 58px;
    background:var(--obsidian);
    opacity:1 !important;
    visibility:visible !important;
    transform:none !important;
    transition:none !important;
  }

  .carrusel-caption > *,
  .carrusel-slide.activa .carrusel-caption > *{
    opacity:1 !important;
    visibility:visible !important;
    animation:none !important;
    transform:none !important;
  }

  .hero-eyebrow{font-size:12px;}

  .carrusel-caption h2{
    font-size:clamp(32px,9vw,40px);
    line-height:1.04;
    max-width:13ch;
    margin:8px 0 10px;
    color:var(--paper);
    text-shadow:0 3px 14px rgba(0,0,0,.85);
  }

  .carrusel-caption p{
    font-size:15px;
    line-height:1.4;
    max-width:30ch;
    margin:0 0 18px;
    color:rgba(255,255,255,.9);
    text-shadow:0 2px 10px rgba(0,0,0,.8);
  }

  .hero-acciones{gap:8px;margin-bottom:0;}
  .hero-acciones .btn{
    min-height:42px;
    padding:10px 14px;
    font-size:13px;
  }

  .carrusel-dots{
    left:calc(var(--gutter) - 8px);
    bottom:14px;
    z-index:10;
  }
}
